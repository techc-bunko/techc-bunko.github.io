<script type="application/json" id="yomi-data">{"slug":"watashi","title":"私が、私になる日","unit":"章","chapters":[{"id":"c1","num":"第 一 章","title":"","html":"\u003cp>私は今人生で三回目の殺人を犯した。殺人と聞けば聞こえは悪いかもしれないが、自分の心を結婚という忌まわしいもののために殺した。\u003c/p>\u003cp>別につらさなんてものはない。実際に手首を切ったり、首を吊るわけではないから慣れてしまえばなんてことはない。\u003c/p>\u003cp>なぜ心を殺すことに慣れているのかと聞かれたら必ず答える決まり文句がある。「私のような家柄に生まれたことのない人にはわからないよ」だ。\u003c/p>\u003cp>私の家は恥ずかしいことに有名な一族だ。祖父も父も政治家で国民の投票で後押しされ国会で答弁をしている。皆からすれば政治家の一族はボンボンで好きなことが何でもできると思われているかもしれない。\u003c/p>\u003cp>あながち間違いではないかもしれない。だけれどそれは男に生まれたらの話だ。女に生まれた私は跡継ぎを早く産めやいい家柄の男と結婚しろなど、たくさんの理不尽に耐えなければならない。\u003c/p>\u003cp>別に可哀そうなお嬢様になりたいわけじゃない。同情が欲しいわけでもない。\u003c/p>\u003cp>これは私が自分の人生の第一歩を歩むためのあらすじだ。\u003c/p>\u003cp>私は先ほども言った通りとある政治家の娘。\u003c/p>\u003cp>私は長女だが上に兄が二人いる。うえが二人とも兄のせいか私はよく女に生まれた恥さらしとののしられてきた。政治家の家では男は跡取りになるから優秀、女はコストがかかるが必ず跡継ぎを産むかわからないから足手まといとされてきた。\u003c/p>\u003cp>私は小さいころからお嬢様学校に行かされ、足手まといなんだから少しでも父と祖父の名前を広げて来いと言われ、学校では常に学級委員や生徒会をやり続け少しも気を緩ませることが許されなかった。家では兄二人の召使のように着替えを用意したり、ご飯の片づけをさせられたり、ひどいときにはストレスのはけ口にされ叩かれたり足置きのかわりにさせられることもあった。\u003c/p>\u003cp>ここまで聞くと法に抵触しているから逃げるチャンスがあるじゃないかといわれることもあったが、兄二人は賢いのでぎりぎりで法に抵触しないようにしていることや、両親が仕事で家にいない時を狙って私を虐げてきた。\u003c/p>\u003cp>正直,限界という言葉では言い表せないほど苦しく辛かった。そこで私は初めて自分の心を殺した。\u003c/p>\u003cp>心を殺すというのが具体的にどういうものかといわれると正確にはわからない。多分人それぞれで方法が違ったり意味合いが変わってくるものだと私は思う。私にとっては何種類もある感情のうちの一つが凍りつき出てこなくなるような感覚だった。\u003c/p>\u003cp>私の場合は学校以外の時は苦しさについて考えるのをやめた。\u003c/p>\u003cp>家では女性は人以下の扱いを受けるものだと学習していたため男を人間よりも位の高い何か他の生物だと自分に言い聞かせた。次第に何をされても仕方ないからいちいち考えないように心がマヒしていった。わたしはこの時初めて心を殺すということがフィクションではなく現実にも起こりうることだと気づいた。\u003c/p>\u003cp>私はこのことに気づいたときにチャンスだと思った。自分で心を殺すことをコントロールできれば無敵になれると思ったからだ。しかし現実は甘くなかった。簡単に心を殺すことなんてできなかった。家以外では辛いことは辛いし、嫌なものは嫌なままだった。私は悔しさからか興味本位化はわからないが私は心を殺すことについてさらに前のめりになっていた。\u003c/p>\u003cp>心を殺すには何が必要なのか、どうしたら自らの意思で心を殺すことができるようになるのかなど仮説を立て続け、日々の生活の中で条件に当てはまるかなどを試行錯誤していった。\u003c/p>\u003cp>しかしながら心を殺すことは簡単なことではない。自分の心がそれ以上のダメージを負いたくないと思うほど傷つかなければならない。その限界値に並大抵の人はたどり着く前に誰かに縋り付いたりするのだろう。しかし私の場合は家でも学校でも縋り付く相手などおらず、一人で耐え続けるしかなかった。多分こういった条件もあいまって私は自身の心を殺さなければいけないところまで逝ってしまったのだろう。\u003c/p>"},{"id":"c2","num":"第 二 章","title":"","html":"\u003cp>それからしばらくは心を殺したこともありそこまで絶望を覚えたりすることもなく生活できていた。しかし悲劇というものは当然にして襲ってくるものだ。\u003c/p>\u003cp>私が高校２年生になったころ私の母が過労で倒れそのまま亡くなってしまった。私に家の中で唯一私と同じ苦しみを体験している人がいなくなってしまった。一人置いていかれるような寂しさが私の胸を襲ってきた。私は多分無意識に母を心のよりどころにしていたのかもしれない、母の葬儀で冷たくなった母に最後に触れたときに私の胸がパキリと音をたてて砕け散った感覚があった。これが私が心を殺した2度目の瞬間だった。\u003c/p>\u003cp>母が死んでから、私はさらに上手に心を殺せるようになった。\u003c/p>\u003cp>泣こうと思えば泣けた。 笑おうと思えば笑えた。\u003c/p>\u003cp>けれどそれは本当に泣いているわけでも笑っているわけでもなかった。\u003c/p>\u003cp>ただ周囲が求める反応を返しているだけだった。\u003c/p>\u003cp>父は母の葬儀が終わって一週間も経たないうちに仕事へ戻った。兄たちは相変わらずだった。むしろ母という緩衝材を失ったことで、家の空気はより冷たくなった。\u003c/p>"},{"id":"c3","num":"第 三 章","title":"","html":"\u003cp>私は大学へ進学した。\u003c/p>\u003cp>もちろん私の意思ではない。\u003c/p>\u003cp>父が選び、祖父が許可し、一族に利益があると判断された大学だった。\u003c/p>\u003cp>政治家や官僚の子供たちが集まる場所。\u003c/p>\u003cp>将来を約束された人間たちが、将来を当然のように語る場所。\u003c/p>\u003cp>そこでも私は「政治家の娘」として扱われた。\u003c/p>\u003cp>誰も私自身に興味などなかった。\u003c/p>\u003cp>父の名前。\u003c/p>\u003cp>祖父の名前。\u003c/p>\u003cp>家の力。\u003c/p>\u003cp>皆が見ているのはそれだけだった。\u003c/p>\u003cp>けれど大学に入って初めて、私は少しだけ自由を知った。\u003c/p>\u003cp>家にいる時間が減ったからだ。\u003c/p>\u003cp>授業が終わってもすぐ帰らず、図書館に残った。\u003c/p>\u003cp>理由もなく構内を歩いた。\u003c/p>\u003cp>ただ一人でいる時間が欲しかった。\u003c/p>"},{"id":"c4","num":"第 四 章","title":"","html":"\u003cp>そんなある日だった。\u003c/p>\u003cp>私は一人の青年と出会った。\u003c/p>\u003cp>彼は私の家のことを知らなかった。\u003c/p>\u003cp>正確には知っていたのかもしれないが興味がなかった。\u003c/p>\u003cp>初めてだった。\u003c/p>\u003cp>私の名前よりも家名に価値を見出さない人間は。\u003c/p>\u003cp>彼は私に言った。\u003c/p>\u003cp class=\"noindent\">「君って、いつも他人の顔色見てるよね」\u003c/p>\u003cp>その言葉に私は凍り付いた。\u003c/p>\u003cp>そんなことを言われたことがなかったからだ。\u003c/p>\u003cp>私は笑ってごまかした。\u003c/p>\u003cp>しかし彼は続けた。\u003c/p>\u003cp class=\"noindent\">「笑う時も謝る時も、なんか先に相手の反応を確認してる」\u003c/p>\u003cp>私は返事ができなかった。\u003c/p>\u003cp>図星だった。\u003c/p>\u003cp>私はもう何年も前から、自分がどう感じるかより相手がどう感じるかを優先して生きていた。\u003c/p>\u003cp>そうしなければ傷つくから。\u003c/p>\u003cp>そうしなければ壊れるから。\u003c/p>\u003cp>その日を境に私は彼と過ごす時間が増えた。\u003c/p>\u003cp>他愛もない話をした。\u003c/p>\u003cp>好きな本の話。\u003c/p>\u003cp>嫌いな食べ物の話。\u003c/p>\u003cp>子供の頃の話。\u003c/p>\u003cp>何の価値もない会話。\u003c/p>\u003cp>けれど私にとっては宝物だった。\u003c/p>\u003cp>私自身として話ができたから。\u003c/p>\u003cp>父の娘でもなく。\u003c/p>\u003cp>政治家一族の人間でもなく。\u003c/p>\u003cp>ただの私として。\u003c/p>\u003cp>そして気付いた。\u003c/p>\u003cp>多分私は彼のことが好きだ。\u003c/p>\u003cp>人生で初めて誰かを好きになったのかもしれない。\u003c/p>\u003cp>だが、その感情は長く続かなかった。\u003c/p>"},{"id":"c5","num":"第 五 章","title":"","html":"\u003cp>大学四年生の春。\u003c/p>\u003cp>父から呼び出された。\u003c/p>\u003cp>応接室には父と祖父、それから見知らぬ男性とその両親が座っていた。\u003c/p>\u003cp>その瞬間に理解した。\u003c/p>\u003cp>私の結婚相手だ、と。\u003c/p>\u003cp>祖父は笑顔だった。\u003c/p>\u003cp>父も満足そうだった。\u003c/p>\u003cp>誰も私の意見など聞かなかった。\u003c/p>\u003cp>いつ式を挙げるのか。\u003c/p>\u003cp>どこに住むのか。\u003c/p>\u003cp>子供は何人欲しいのか。\u003c/p>\u003cp>そんな話だけが進んでいく。\u003c/p>\u003cp>私は黙っていた。\u003c/p>\u003cp>いや、黙ることしかできなかった。\u003c/p>\u003cp>その日の帰り道。\u003c/p>\u003cp>私は何度も彼に電話をかけようとした。\u003c/p>\u003cp>助けてと言えばよかった。\u003c/p>\u003cp>一緒に逃げてと言えばよかった。\u003c/p>\u003cp>けれど結局できなかった。\u003c/p>\u003cp>私には誰かを巻き込む勇気がなかった。\u003c/p>\u003cp>家から逃げることよりも。\u003c/p>\u003cp>期待を裏切ることよりも。\u003c/p>\u003cp>幸せになることの方が怖かった。\u003c/p>\u003cp>だから私は選んだ。\u003c/p>\u003cp>三度目の殺人を。\u003c/p>\u003cp>彼への想いを。\u003c/p>\u003cp>自分の未来への希望を。\u003c/p>\u003cp>愛するという感情を。\u003c/p>\u003cp>全て殺した。\u003c/p>\u003cp>私は彼に結婚することを告げた。\u003c/p>\u003cp>理由は話せなかった。\u003c/p>\u003cp>彼は最後まで私に問いかけてきた。\u003c/p>\u003cp class=\"noindent\">「本当に結婚していいのか」\u003c/p>\u003cp class=\"noindent\">「結婚して君自身は幸せになれるのか」\u003c/p>\u003cp>それでも私は笑った。\u003c/p>\u003cp>昔から得意だった作り物の笑顔で。\u003c/p>\u003cp>その日。\u003c/p>\u003cp>私は人生で三回目の自分を殺した。\u003c/p>"},{"id":"c6","num":"第 六 章","title":"","html":"\u003cp>そして結婚式の日が来た。\u003c/p>\u003cp>純白のドレス。\u003c/p>\u003cp>豪華な式場。\u003c/p>\u003cp>祝福の拍手。\u003c/p>\u003cp>誰もが幸せそうだった。\u003c/p>\u003cp>私以外。\u003c/p>\u003cp>神父が問いかける。\u003c/p>\u003cp class=\"noindent\">「あなたはこの人を生涯愛することを誓いますか」\u003c/p>\u003cp>私は答えようとした。\u003c/p>\u003cp>いつも通り。\u003c/p>\u003cp>周囲が求める言葉を。\u003c/p>\u003cp>その時だった。\u003c/p>\u003cp>不意に母の顔が浮かんだ。\u003c/p>\u003cp>優しかった母。\u003c/p>\u003cp>いつも疲れていた母。\u003c/p>\u003cp>最後まで何も変えられなかった母。\u003c/p>\u003cp>そしてふと思った。\u003c/p>\u003cp>母は本当に幸せだったのだろうか。\u003c/p>\u003cp>その答えは分からない。\u003c/p>\u003cp>けれど一つだけ分かることがあった。\u003c/p>\u003cp>私は母と同じになろうとしている。\u003c/p>\u003cp>自分を殺し続けて。\u003c/p>\u003cp>何も言わずに。\u003c/p>\u003cp>静かに。\u003c/p>\u003cp>人生を終えようとしている。\u003c/p>\u003cp>気付けば涙がこぼれていた。\u003c/p>\u003cp>止まらなかった。\u003c/p>\u003cp>何年ぶりかも分からない本物の涙だった。\u003c/p>\u003cp>会場がざわつく。\u003c/p>\u003cp>父が険しい顔をする。\u003c/p>\u003cp>祖父が立ち上がる。\u003c/p>\u003cp>それでも私は初めて、自分の意志で口を開いた。\u003c/p>\u003cp class=\"noindent\">「嫌です」\u003c/p>\u003cp>静まり返った。\u003c/p>\u003cp class=\"noindent\">「私はこの結婚をしたくありません」\u003c/p>\u003cp>父が私の名前を怒鳴った。\u003c/p>\u003cp>祖父が恥さらしだと叫んだ。\u003c/p>\u003cp>けれど不思議だった。\u003c/p>\u003cp>全く怖くなかった。\u003c/p>\u003cp>あれほど長い間、私を縛り続けていた視線も声も、その瞬間にはまるで遠くの雑音のようにしか聞こえなかった。\u003c/p>\u003cp>父は立ち上がり、こちらへ歩み寄ろうとする。\u003c/p>\u003cp>祖父は顔を真っ赤にして怒鳴っていた。\u003c/p>\u003cp>招待客たちも困惑し、誰かが小さな声で私の名前を呼んでいる。\u003c/p>\u003cp>けれど私は不思議なくらい冷静だった。\u003c/p>\u003cp>心臓は激しく鼓動しているのに、頭の中だけが澄み渡っている。\u003c/p>\u003cp>きっとこれが、本当に自分で選ぶということなのだろう。\u003c/p>"},{"id":"c7","num":"第 七 章","title":"","html":"\u003cp class=\"noindent\">「申し訳ありません」\u003c/p>\u003cp>私は深く頭を下げた。\u003c/p>\u003cp>今まで数え切れないほど謝罪をしてきた。\u003c/p>\u003cp>怒られた時。\u003c/p>\u003cp>理不尽なことを押し付けられた時。\u003c/p>\u003cp>何も悪くないのに責任を取らされた時。\u003c/p>\u003cp>けれど今回だけは違った。\u003c/p>\u003cp>私は誰かの機嫌を取るために謝っているのではない。\u003c/p>\u003cp>自分で決めた道を進むために、けじめとして頭を下げていた。\u003c/p>\u003cp class=\"noindent\">「私はもう、人形ではありません」\u003c/p>\u003cp>自分でも驚くほどはっきりとした声だった。\u003c/p>\u003cp>会場が静まり返る。\u003c/p>\u003cp>父の表情が凍り付いた。\u003c/p>\u003cp>祖父の目が見開かれる。\u003c/p>\u003cp>今まで一度も逆らったことのない娘が反旗を翻したのだ。\u003c/p>\u003cp>無理もない。\u003c/p>\u003cp class=\"noindent\">「勝手なことを言うな！」\u003c/p>\u003cp>父が叫ぶ。\u003c/p>\u003cp class=\"noindent\">「お前が今まで誰のおかげで生きてこられたと思っている！」\u003c/p>\u003cp>その言葉に、ふと笑いそうになった。\u003c/p>\u003cp>私は確かに守られてきたのだろう。\u003c/p>\u003cp>衣食住に困ったことはない。\u003c/p>\u003cp>高い教育も受けた。\u003c/p>\u003cp>多くの人が羨む生活だったと思う。\u003c/p>\u003cp>だけど。\u003c/p>\u003cp>それは生きていたと言えるのだろうか。\u003c/p>\u003cp>私はゆっくりと顔を上げた。\u003c/p>\u003cp class=\"noindent\">「お父様」\u003c/p>\u003cp>久しぶりにそう呼んだ気がした。\u003c/p>\u003cp class=\"noindent\">「私は今まで十分に恩返しをしたと思います」\u003c/p>\u003cp>学級委員も。\u003c/p>\u003cp>生徒会も。\u003c/p>\u003cp>家の手伝いも。\u003c/p>\u003cp>家名のための振る舞いも。\u003c/p>\u003cp>望まれた娘を演じ続けた年月も。\u003c/p>\u003cp>全て。\u003c/p>\u003cp>私は自分の人生を差し出してきた。\u003c/p>\u003cp>だからもういいだろうと思った。\u003c/p>\u003cp class=\"noindent\">「残りの人生くらい、私にください」\u003c/p>\u003cp>父は何か言い返そうとした。\u003c/p>\u003cp>しかし言葉にならなかった。\u003c/p>\u003cp>私ももう待たない。\u003c/p>\u003cp>踵を返し、一歩を踏み出す。\u003c/p>\u003cp>その一歩は驚くほど軽かった。\u003c/p>\u003cp>式場の扉を抜ける。\u003c/p>\u003cp>外の光が目に飛び込んできた。\u003c/p>\u003cp>眩しかった。\u003c/p>\u003cp>まるで初めて外へ出たみたいに。\u003c/p>\u003cp>頬を撫でる風が心地よい。\u003c/p>\u003cp>私は空を見上げた。\u003c/p>\u003cp>青空だった。\u003c/p>\u003cp>母が亡くなった日も。\u003c/p>\u003cp>彼と出会った日も。\u003c/p>\u003cp>今日と同じ空だったのだろうか。\u003c/p>\u003cp>そんなことを考えながら歩いていると、不意に涙が溢れた。\u003c/p>\u003cp>今度は悲しいからではない。\u003c/p>\u003cp>悔しいからでもない。\u003c/p>\u003cp>安心したのだ。\u003c/p>\u003cp>ようやく終わったのだと。\u003c/p>\u003cp>誰かの娘として生きる人生が。\u003c/p>\u003cp>誰かのためだけの人生が。\u003c/p>\u003cp>私はその場にしゃがみ込み、声を上げて泣いた。\u003c/p>\u003cp>何年分だろう。\u003c/p>\u003cp>十年か。\u003c/p>\u003cp>二十年か。\u003c/p>\u003cp>溜め込んできた感情が堰を切ったように溢れ出した。\u003c/p>\u003cp>しばらくして顔を上げる。\u003c/p>\u003cp>泣き続けたせいで視界は最悪だった。\u003c/p>"},{"id":"c8","num":"第 八 章","title":"","html":"\u003cp>その霞んだ景色の向こうに、一人の人影が見えた。\u003c/p>\u003cp>見間違えるはずがない。\u003c/p>\u003cp>彼だった。\u003c/p>\u003cp>私が初めて好きになったかもしれない人。\u003c/p>\u003cp>彼は困ったように笑っていた。\u003c/p>\u003cp class=\"noindent\">「やっと本音を言えたんだね」\u003c/p>\u003cp>私は言葉を失った。\u003c/p>\u003cp>どうしてここにいるのか。\u003c/p>\u003cp>そんな疑問よりも先に胸が熱くなった。\u003c/p>\u003cp>彼はゆっくり近づいてくる。\u003c/p>\u003cp class=\"noindent\">「君、結構有名人だからさ」\u003c/p>\u003cp>そう言って肩をすくめた。\u003c/p>\u003cp class=\"noindent\">「結婚式の噂くらい耳に入る」\u003c/p>\u003cp>私は泣き笑いのような顔になった。\u003c/p>\u003cp>これほど格好悪い再会もない。\u003c/p>\u003cp>ドレス姿のまま。\u003c/p>\u003cp>顔は涙でぐしゃぐしゃ。\u003c/p>\u003cp>言いたいこともまとまらない。\u003c/p>\u003cp>それでも彼は笑わなかった。\u003c/p>\u003cp class=\"noindent\">「ねえ」\u003c/p>\u003cp>私は震える声で尋ねる。\u003c/p>\u003cp class=\"noindent\">「私、今さら遅いかな」\u003c/p>\u003cp>彼は少しだけ考えた後、首を横に振った。\u003c/p>\u003cp class=\"noindent\">「人生に遅いなんてないよ」\u003c/p>\u003cp>その言葉を聞いた瞬間、胸の奥で何かがほどけた。\u003c/p>\u003cp>ずっと凍りついていたもの。\u003c/p>\u003cp>ずっと閉じ込めていたもの。\u003c/p>\u003cp>三回殺したと思っていた心の欠片たちが、少しずつ動き出す。\u003c/p>\u003cp>ああ。\u003c/p>\u003cp>私は勘違いしていたのかもしれない。\u003c/p>\u003cp>心は死なないのだ。\u003c/p>\u003cp>傷ついて。\u003c/p>\u003cp>砕けて。\u003c/p>\u003cp>動かなくなることはあっても。\u003c/p>\u003cp>完全には死なない。\u003c/p>\u003cp>だからまた立ち上がれる。\u003c/p>\u003cp>また誰かを好きになれる。\u003c/p>\u003cp>また自分を信じられる。\u003c/p>\u003cp>私は彼に向かって微笑んだ。\u003c/p>\u003cp>作り物ではない。\u003c/p>\u003cp>生まれて初めての、本当の笑顔だった。\u003c/p>\u003cp>そして一歩を踏み出す。\u003c/p>\u003cp>未来へ向かって。\u003c/p>\u003cp>誰かに用意された道ではなく。\u003c/p>\u003cp>自分で選んだ道へ。\u003c/p>\u003cp>私は三回、自分を殺した。\u003c/p>\u003cp>幼い頃に希望を。\u003c/p>\u003cp>母を失った日に弱さを。\u003c/p>\u003cp>そして結婚のために愛を。\u003c/p>\u003cp>だけど、その全てを乗り越えてようやく分かった。\u003c/p>\u003cp>人は自分を殺し続けるために生まれてきたわけじゃない。\u003c/p>\u003cp>傷ついても。\u003c/p>\u003cp>間違えても。\u003c/p>\u003cp>遠回りしても。\u003c/p>\u003cp>最後には自分自身として生きるために生まれてきたのだ。\u003c/p>\u003cp>誰かの娘ではなく。\u003c/p>\u003cp>誰かの駒でもなく。\u003c/p>\u003cp>誰かの期待でもなく。\u003c/p>\u003cp>ただ一人の私として。\u003c/p>\u003cp>この日。\u003c/p>\u003cp>私は初めて人生の第一歩を踏み出した。\u003c/p>\u003cp>これが、私が、私になる日。\u003c/p>"}]}</script>
