<script type="application/json" id="yomi-data">{"slug":"rettoukan","title":"劣等感は味方","unit":"話","chapters":[{"id":"c1","num":"第 一 話","title":"","html":"\u003cp>私はいつもどおり電車に揺られ会社に向かっていた。\u003c/p>\u003cp>学生時代夢見ていた社会人生活とのギャップに、いまだに慣れることができない。\u003c/p>\u003cp>高校生の頃の私は社会人というものをもっと華やかな存在だと思っていた。\u003c/p>\u003cp>好きな仕事をして。\u003c/p>\u003cp>成果を出して。\u003c/p>\u003cp>周りから認められて。\u003c/p>\u003cp>毎日が充実している。\u003c/p>\u003cp>そんな都合のいい幻想を抱いていた。\u003c/p>\u003cp>しかし現実は違う。\u003c/p>\u003cp>終わらない仕事。\u003c/p>\u003cp>減らないメール。\u003c/p>\u003cp>上司に怒られ続ける日々。\u003c/p>\u003cp>ふとSNSを見ると大学の時の同期が、\u003c/p>\u003cp class=\"noindent\">「念願の海外出張！」\u003c/p>\u003cp class=\"noindent\">「昇進しました！」\u003c/p>\u003cp class=\"noindent\">「プロジェクト大成功！」\u003c/p>\u003cp>そんな投稿を次々と上げている。\u003c/p>\u003cp>画面をスクロールするたびに胸の奥が重くなった。\u003c/p>\u003cp>どうしてみんなそんなに順調なんだろう。\u003c/p>\u003cp>確かにみんなと比べると私はそこまで容量もよくないし、何かに特化してもいない。いわゆる器用貧乏だ。\u003c/p>\u003cp>おなじ大学で同じ授業を受けていたはずなのにどうしてここまで差がついてしまったのだろうか。私はどこで間違えてしまったのだろうか。\u003c/p>\u003cp>そんなことを考えながら生活していたある日。\u003c/p>\u003cp>いつものように上司に怒られて落ち込んでいると先輩が私をランチに誘ってくれた。\u003c/p>\u003cp>私は小さく頭を下げ、先輩の後について会社近くの定食屋へ向かった。\u003c/p>"},{"id":"c2","num":"第 二 話","title":"","html":"\u003cp>昼時ということもあり店内は賑わっていたが、私の気分は相変わらず沈んだままだった。\u003c/p>\u003cp>席に着くと先輩はメニューも見ずに日替わり定食を注文した。\u003c/p>\u003cp>私もそれにならう。\u003c/p>\u003cp>しばらく沈黙が続いた。\u003c/p>\u003cp>先輩は特に励ますわけでもなく、仕事の話を切り出すわけでもない。\u003c/p>\u003cp>その静けさが逆に心地よかった。\u003c/p>\u003cp>やがて料理が運ばれてくると、先輩が口を開いた。\u003c/p>\u003cp class=\"noindent\">「最近、結構きつそうだな」\u003c/p>\u003cp>図星だった。\u003c/p>\u003cp>私は曖昧に笑った。\u003c/p>\u003cp class=\"noindent\">「そんなことないです」\u003c/p>\u003cp class=\"noindent\">「いや、あるだろ」\u003c/p>\u003cp>即答だった。\u003c/p>\u003cp>ごまかせると思った私の方が甘かった。\u003c/p>\u003cp>先輩は味噌汁を一口飲んでから続けた。\u003c/p>\u003cp class=\"noindent\">「毎日怒られてるしな」\u003c/p>\u003cp>私は思わず苦笑した。\u003c/p>\u003cp class=\"noindent\">「見てたんですか」\u003c/p>\u003cp class=\"noindent\">「見なくても分かる。顔に全部出てる」\u003c/p>\u003cp>そう言われると何も返せない。\u003c/p>\u003cp>少しの沈黙の後、私はぽつりと本音をこぼした。\u003c/p>\u003cp class=\"noindent\">「みんなすごいじゃないですか」\u003c/p>\u003cp class=\"noindent\">「ん？」\u003c/p>\u003cp class=\"noindent\">「同期とか友達とか。昇進したり、大きな仕事任されたり。SNS見てもキラキラした話ばっかりで」\u003c/p>\u003cp>言葉は止まらなかった。\u003c/p>\u003cp class=\"noindent\">「それに比べて私は毎日ミスばっかりですし」\u003c/p>\u003cp class=\"noindent\">「仕事も遅いし」\u003c/p>\u003cp class=\"noindent\">「怒られてばっかりだし」\u003c/p>\u003cp class=\"noindent\">「正直、自分が社会人向いてる気がしなくて」\u003c/p>\u003cp>話し終える頃には、自分でも驚くほど弱音を吐いていた。\u003c/p>"},{"id":"c3","num":"第 三 話","title":"","html":"\u003cp>先輩は黙って聞いていた。\u003c/p>\u003cp>そして一言だけ言った。\u003c/p>\u003cp class=\"noindent\">「お前が一番向いてるよ。」\u003c/p>\u003cp>私は開いた口がふさがらなかった。\u003c/p>\u003cp class=\"noindent\">「……え？」\u003c/p>\u003cp>思わず聞き返す。\u003c/p>\u003cp>だって、その言葉は今の私に向けられるものではないと思ったからだ。\u003c/p>\u003cp>毎日怒られている。\u003c/p>\u003cp>仕事も遅い。\u003c/p>\u003cp>ミスも多い。\u003c/p>\u003cp>評価される要素なんてどこにもない。\u003c/p>\u003cp>先輩は箸で焼き魚をほぐしながら言った。\u003c/p>\u003cp class=\"noindent\">「自分じゃ気付いてないんだな」\u003c/p>\u003cp class=\"noindent\">「何がですか」\u003c/p>\u003cp class=\"noindent\">「お前さ、怒られても次の日ちゃんと来るだろ」\u003c/p>\u003cp>私は首をかしげた。\u003c/p>\u003cp>当たり前のことだと思った。\u003c/p>\u003cp>来ないと余計に怒られる。\u003c/p>\u003cp>仕事なんだから。\u003c/p>\u003cp>そう答えようとしたが、先輩は先に続けた。\u003c/p>\u003cp class=\"noindent\">「意外とそれができない人もいるんだよ」\u003c/p>\u003cp class=\"noindent\">「いや、でも社会人なら普通じゃ……」\u003c/p>\u003cp class=\"noindent\">「普通じゃない」\u003c/p>\u003cp>先輩はきっぱりと言った。\u003c/p>\u003cp class=\"noindent\">「怒られて、自信なくして、逃げる奴を何人も見てきた」\u003c/p>\u003cp>私は言葉を失った。\u003c/p>\u003cp>先輩は会社に長くいる。\u003c/p>\u003cp>きっと私の知らないものをたくさん見てきたのだろう。\u003c/p>\u003cp class=\"noindent\">「お前はな」\u003c/p>\u003cp>先輩は私を見る。\u003c/p>\u003cp class=\"noindent\">「毎日落ち込んでるし、毎日凹んでる」\u003c/p>\u003cp class=\"noindent\">「はい……」\u003c/p>\u003cp class=\"noindent\">「でもちゃんと直そうとしてる」\u003c/p>\u003cp class=\"noindent\">「それは当然です」\u003c/p>\u003cp class=\"noindent\">「それができる奴が少ないんだよ」\u003c/p>\u003cp>その言葉に私は何も返せなかった。\u003c/p>\u003cp>先輩は続ける。\u003c/p>\u003cp class=\"noindent\">「お前、自分ができないことばっかり見てるだろ」\u003c/p>\u003cp>図星だった。\u003c/p>\u003cp>頭の中には失敗ばかり残る。\u003c/p>\u003cp>上司に怒られたこと。\u003c/p>\u003cp>メールの送り忘れ。\u003c/p>\u003cp>資料のミス。\u003c/p>\u003cp>そんな記憶ばかりだ。\u003c/p>\u003cp class=\"noindent\">「じゃあ聞くけど」\u003c/p>\u003cp>先輩が言った。\u003c/p>\u003cp class=\"noindent\">「半年前のお前と今のお前、同じか？」\u003c/p>\u003cp>私は少し考える。\u003c/p>\u003cp>入社したばかりの頃。\u003c/p>\u003cp>電話が鳴るだけで緊張していた。\u003c/p>\u003cp>メール一本送るのに先輩へ何度も確認していた。\u003c/p>\u003cp>会議では何も話せなかった。\u003c/p>\u003cp>それが今はどうだろう。\u003c/p>\u003cp>電話対応は普通にできる。\u003c/p>\u003cp>資料も一人で作る。\u003c/p>\u003cp>担当業務も少しずつ増えている。\u003c/p>\u003cp>もちろん完璧ではない。\u003c/p>\u003cp>だが、全く成長していないわけではなかった。\u003c/p>\u003cp class=\"noindent\">「……少しはできること増えました」\u003c/p>\u003cp>私がそう言うと、先輩は小さく笑った。\u003c/p>\u003cp class=\"noindent\">「だろ？」\u003c/p>"},{"id":"c4","num":"第 四 話","title":"","html":"\u003cp class=\"noindent\">「でもみんなもっと成長してます」\u003c/p>\u003cp>すると先輩は呆れたようにため息をついた。\u003c/p>\u003cp class=\"noindent\">「またそれか」\u003c/p>\u003cp class=\"noindent\">「だって事実ですし」\u003c/p>\u003cp class=\"noindent\">「お前な」\u003c/p>\u003cp>先輩は味噌汁のお椀を置いた。\u003c/p>\u003cp class=\"noindent\">「お前がSNSで見たやつが本当に自分の力だけでやったと思ってるか？」\u003c/p>\u003cp>私は言葉に詰まった。\u003c/p>\u003cp>考えたこともなかった。\u003c/p>\u003cp>昇進した同期。\u003c/p>\u003cp>海外出張に行った友人。\u003c/p>\u003cp>大きなプロジェクトを成功させた同級生。\u003c/p>\u003cp>私はずっと、それが全部その人自身の実力の結果だと思っていた。\u003c/p>\u003cp>すると先輩は続けた。\u003c/p>\u003cp class=\"noindent\">「たまたま良い上司に当たった奴もいる」\u003c/p>\u003cp class=\"noindent\">「たまたま景気の良い部署に配属された奴もいる」\u003c/p>\u003cp class=\"noindent\">「優秀な先輩に育ててもらった奴もいる」\u003c/p>\u003cp class=\"noindent\">「運よく大きな案件に入れた奴もいる」\u003c/p>\u003cp>私は黙って聞いていた。\u003c/p>\u003cp>先輩は箸を置く。\u003c/p>\u003cp class=\"noindent\">「もちろん本人の努力もある」\u003c/p>\u003cp class=\"noindent\">「でもな、世の中って努力だけじゃないんだよ」\u003c/p>\u003cp>その言葉は少し意外だった。\u003c/p>\u003cp>先輩はいつも努力家だったからだ。\u003c/p>\u003cp>誰よりも早く出社し。\u003c/p>\u003cp>誰よりも勉強し。\u003c/p>\u003cp>誰よりも仕事ができる。\u003c/p>\u003cp>そんな人だった。\u003c/p>\u003cp>だからこそ、\u003c/p>\u003cp class=\"noindent\">「努力すれば何でもできる」\u003c/p>\u003cp>と言うのかと思っていた。\u003c/p>\u003cp>しかし先輩は首を横に振った。\u003c/p>\u003cp class=\"noindent\">「努力は大事だ」\u003c/p>\u003cp class=\"noindent\">「でも努力だけで全部決まるほど世の中単純じゃない」\u003c/p>\u003cp>先輩は少し遠くを見るような目をした。\u003c/p>\u003cp class=\"noindent\">「俺だって新人の頃、同期で一番優秀だったわけじゃない」\u003c/p>\u003cp class=\"noindent\">「むしろ下から数えた方が早かった」\u003c/p>\u003cp class=\"noindent\">「え？」\u003c/p>\u003cp>思わず声が出た。\u003c/p>\u003cp>信じられなかった。\u003c/p>\u003cp>会社でもエースと呼ばれている先輩が。\u003c/p>\u003cp>先輩は苦笑する。\u003c/p>\u003cp class=\"noindent\">「びっくりしたか」\u003c/p>\u003cp class=\"noindent\">「正直、はい」\u003c/p>\u003cp class=\"noindent\">「昔は毎日怒られてたぞ」\u003c/p>\u003cp>私は思わず笑った。\u003c/p>\u003cp>想像できない。\u003c/p>\u003cp>だが先輩は真顔だった。\u003c/p>\u003cp>冗談ではないらしい。\u003c/p>\u003cp class=\"noindent\">「同期はどんどん先に行った」\u003c/p>\u003cp class=\"noindent\">「昇進も負けた」\u003c/p>\u003cp class=\"noindent\">「評価も負けた」\u003c/p>\u003cp class=\"noindent\">「ボーナスも負けた」\u003c/p>\u003cp>私は耳を疑った。\u003c/p>\u003cp class=\"noindent\">「でもな」\u003c/p>\u003cp>先輩は言う。\u003c/p>\u003cp class=\"noindent\">「俺はおいてかれたことを恥ずかしいとは思わなかった。逆に運がいいなと思った。」\u003c/p>\u003cp>私は訳が分からず聞き返した。\u003c/p>\u003cp class=\"noindent\">「運がいい？」\u003c/p>\u003cp>先輩は笑いながら続けた。\u003c/p>\u003cp class=\"noindent\">「ああ。変に勘違いしなかったからな。さっきも言ったけど、先に成功した奴がそいつだけの力で成功したとは思えなかったからだ。」\u003c/p>"},{"id":"c5","num":"第 五 話","title":"","html":"\u003cp>私は黙って耳を傾ける。\u003c/p>\u003cp>先輩は箸を置くと、ゆっくりと話し始めた。\u003c/p>\u003cp class=\"noindent\">「新人の頃さ、同期にめちゃくちゃ優秀な奴がいたんだよ」\u003c/p>\u003cp class=\"noindent\">「はい」\u003c/p>\u003cp class=\"noindent\">「頭も良い。仕事も早い。営業成績もトップ。上司にも可愛がられてた」\u003c/p>\u003cp>まさに絵に描いたようなエリートだった。\u003c/p>\u003cp class=\"noindent\">「俺なんか比較にもならなかった」\u003c/p>\u003cp>先輩は笑った。\u003c/p>\u003cp class=\"noindent\">「当然、そいつは誰より早く昇進した」\u003c/p>\u003cp class=\"noindent\">「すごいですね」\u003c/p>\u003cp class=\"noindent\">「ああ。実際すごかった」\u003c/p>\u003cp>そこで先輩は少し言葉を区切った。\u003c/p>\u003cp class=\"noindent\">「でもな、その頃の俺はずっと近くで見てたんだ」\u003c/p>\u003cp class=\"noindent\">「何をですか？」\u003c/p>\u003cp class=\"noindent\">「そいつがどれだけ運に恵まれてたかを」\u003c/p>\u003cp>私は首を傾げた。\u003c/p>\u003cp>先輩は指を折りながら数える。\u003c/p>\u003cp class=\"noindent\">「入社して最初に配属された部署は会社で一番売上が伸びてた部署」\u003c/p>\u003cp>一本。\u003c/p>\u003cp class=\"noindent\">「直属の上司は教育が上手い人だった」\u003c/p>\u003cp>二本。\u003c/p>\u003cp class=\"noindent\">「大きな案件を任されるタイミングも良かった」\u003c/p>\u003cp>三本。\u003c/p>\u003cp class=\"noindent\">「しかも周りの先輩も優秀だった」\u003c/p>\u003cp>四本。\u003c/p>\u003cp class=\"noindent\">「もちろん本人も努力してた」\u003c/p>\u003cp>そう言ってから先輩は続ける。\u003c/p>\u003cp class=\"noindent\">「でも、本人ですらコントロールできない要素もたくさんあった」\u003c/p>\u003cp>私はハッとした。\u003c/p>\u003cp>今まで考えたこともなかった。\u003c/p>\u003cp>成功者を見る時。\u003c/p>\u003cp>私は結果しか見ていなかった。\u003c/p>\u003cp>その人が置かれた環境も。\u003c/p>\u003cp>巡り合わせも。\u003c/p>\u003cp>出会った人も。\u003c/p>\u003cp>何も見ていなかった。\u003c/p>\u003cp>先輩は静かに言う。\u003c/p>\u003cp class=\"noindent\">「人間はな、自分が頑張った部分は見える」\u003c/p>\u003cp class=\"noindent\">「でも運が良かった部分は見えなくなる」\u003c/p>\u003cp>その言葉は妙に現実味があった。\u003c/p>\u003cp class=\"noindent\">「だから成功した時に勘違いする奴もいる」\u003c/p>\u003cp class=\"noindent\">「全部自分の実力だって？」\u003c/p>\u003cp class=\"noindent\">「そう」\u003c/p>\u003cp>先輩は頷いた。\u003c/p>\u003cp class=\"noindent\">「それで失敗した時に壊れる」\u003c/p>\u003cp>私は黙った。\u003c/p>"},{"id":"c6","num":"第 六 話","title":"","html":"\u003cp>先輩は続ける。\u003c/p>\u003cp class=\"noindent\">「逆に俺はずっと失敗してたからな」\u003c/p>\u003cp class=\"noindent\">「だから分かってた」\u003c/p>\u003cp class=\"noindent\">「何をですか」\u003c/p>\u003cp class=\"noindent\">「自分の能力の限界だ。今の自分ならここまでならできる、でもこの先はできない。だからできるところを完璧にする努力をした。」\u003c/p>\u003cp>先輩はそう言って水を一口飲んだ。\u003c/p>\u003cp class=\"noindent\">「新人の頃の俺はさ、自分にないものばっかり数えてた」\u003c/p>\u003cp class=\"noindent\">「ないもの？」\u003c/p>\u003cp class=\"noindent\">「ああ。頭の回転が速くない。営業センスもない。人を惹きつける話し方もできない。おまけに要領も悪い」\u003c/p>\u003cp>私は思わず苦笑した。\u003c/p>\u003cp>どこか自分と重なったからだ。\u003c/p>\u003cp>先輩は続ける。\u003c/p>\u003cp class=\"noindent\">「だから最初は苦しかったよ」\u003c/p>\u003cp class=\"noindent\">「同期と比べてました？」\u003c/p>\u003cp class=\"noindent\">「毎日な」\u003c/p>\u003cp>先輩は笑った。\u003c/p>\u003cp class=\"noindent\">「なんであいつは一時間で終わるのに、俺は三時間かかるんだって」\u003c/p>\u003cp>私は大きく頷いた。\u003c/p>\u003cp>まさに今の私だった。\u003c/p>\u003cp class=\"noindent\">「でもある日気付いたんだ」\u003c/p>\u003cp class=\"noindent\">「何をですか」\u003c/p>\u003cp class=\"noindent\">「俺のほうがきれいに作れてるって。」\u003c/p>\u003cp>私は思わず顔を上げた。\u003c/p>\u003cp>先輩は少し照れくさそうに笑う。\u003c/p>\u003cp class=\"noindent\">「もちろん時間はかかってたぞ」\u003c/p>\u003cp class=\"noindent\">「はい」\u003c/p>\u003cp class=\"noindent\">「同期は一時間で資料を作る」\u003c/p>\u003cp class=\"noindent\">「俺は三時間かかる」\u003c/p>\u003cp class=\"noindent\">「でも完成した資料を見返したらな」\u003c/p>\u003cp>先輩は指を立てた。\u003c/p>\u003cp class=\"noindent\">「誤字は少ない」\u003c/p>\u003cp class=\"noindent\">「数字のミスも少ない」\u003c/p>\u003cp class=\"noindent\">「お客さんからの質問にも答えられる」\u003c/p>\u003cp>私は黙って聞いた。\u003c/p>\u003cp class=\"noindent\">「つまり」\u003c/p>\u003cp>先輩は言う。\u003c/p>\u003cp class=\"noindent\">「遅い代わりに丁寧だったんだよ」\u003c/p>\u003cp>その言葉に私は少しハッとした。\u003c/p>\u003cp>先輩は続ける。\u003c/p>\u003cp class=\"noindent\">「人間って不思議でな」\u003c/p>\u003cp class=\"noindent\">「できないことばっかり見てると、自分のできることも見えなくなる」\u003c/p>\u003cp>私は思わず苦笑した。\u003c/p>\u003cp>まさに今の自分だった。\u003c/p>\u003cp>同期と比べて仕事が遅い。\u003c/p>\u003cp>だからダメ。\u003c/p>\u003cp>そこで思考が止まっていた。\u003c/p>\u003cp>でも。\u003c/p>\u003cp>遅いなりに確認している部分や。\u003c/p>\u003cp>慎重に進めている部分もあった。\u003c/p>\u003cp>先輩は私を見ながら言った。\u003c/p>\u003cp class=\"noindent\">「お前も似てるんだよ」\u003c/p>\u003cp class=\"noindent\">「私ですか？」\u003c/p>\u003cp class=\"noindent\">「ああ」\u003c/p>\u003cp>即答だった。\u003c/p>\u003cp class=\"noindent\">「お前、仕事は遅い」\u003c/p>\u003cp>グサリと刺さった。\u003c/p>\u003cp>先輩は笑う。\u003c/p>\u003cp class=\"noindent\">「でもな」\u003c/p>\u003cp class=\"noindent\">「お前が作った資料って意外とミス少ないだろ」\u003c/p>\u003cp>私は少し考えた。\u003c/p>\u003cp>確かに大きなミスは少ない。\u003c/p>\u003cp>その代わり時間がかかる。\u003c/p>\u003cp class=\"noindent\">「それは何度も確認してるからです」\u003c/p>\u003cp class=\"noindent\">「それでいいじゃないか」\u003c/p>\u003cp>私は言葉に詰まった。\u003c/p>\u003cp>先輩は続ける。\u003c/p>\u003cp class=\"noindent\">「世の中には速い奴がいる」\u003c/p>\u003cp class=\"noindent\">「でも雑な奴もいる」\u003c/p>\u003cp class=\"noindent\">「逆に遅い奴もいる」\u003c/p>\u003cp class=\"noindent\">「でも丁寧な奴もいる」\u003c/p>\u003cp>そして穏やかに言った。\u003c/p>\u003cp class=\"noindent\">「どうしてお前は速い奴とだけ比べるんだ？」\u003c/p>\u003cp>その一言に何も言えなくなった。\u003c/p>\u003cp>確かにそうだ。\u003c/p>\u003cp>私はいつも自分にないものを持っている人ばかり見ていた。\u003c/p>\u003cp>だから劣等感ばかり募った。\u003c/p>\u003cp>でも。\u003c/p>\u003cp>自分にあるものは一度も数えたことがなかった。\u003c/p>"},{"id":"c7","num":"第 七 話","title":"","html":"\u003cp>先輩は少し真面目な顔になる。\u003c/p>\u003cp class=\"noindent\">「社会人になってから本当に大事なのはな」\u003c/p>\u003cp class=\"noindent\">「何ですか」\u003c/p>\u003cp class=\"noindent\">「自分の戦い方を知ることだ」\u003c/p>\u003cp>私は黙る。\u003c/p>\u003cp class=\"noindent\">「お前は俺に似てる。だから俺が先輩からもらった金言をお前にも伝えとく。」\u003c/p>\u003cp>私は自然と背筋を伸ばした。\u003c/p>\u003cp>先輩は箸を置く。\u003c/p>\u003cp>そして静かに言った。\u003c/p>\u003cp class=\"noindent\">「劣等感を感じてる奴ほど生き残る。『劣等感ってのは自己分析の証だ。』」\u003c/p>\u003cp>私は思わず眉をひそめた。\u003c/p>\u003cp class=\"noindent\">「自己分析ですか？」\u003c/p>\u003cp>先輩は頷く。\u003c/p>\u003cp class=\"noindent\">「ああ」\u003c/p>\u003cp class=\"noindent\">「だって劣等感って苦しいじゃないですか」\u003c/p>\u003cp class=\"noindent\">「苦しいよ」\u003c/p>\u003cp>即答だった。\u003c/p>\u003cp class=\"noindent\">「でもな」\u003c/p>\u003cp>先輩は続ける。\u003c/p>\u003cp class=\"noindent\">「劣等感を感じるってことは、自分に足りないものを認識できてるってことなんだ」\u003c/p>\u003cp>私は黙る。\u003c/p>\u003cp>先輩の言葉を頭の中で反芻した。\u003c/p>\u003cp>足りないものを認識できている。\u003c/p>\u003cp>それは今まで考えたことのない視点だった。\u003c/p>\u003cp>先輩は笑う。\u003c/p>\u003cp class=\"noindent\">「逆に一番危ないのは、自分は完璧だと思ってる奴だ」\u003c/p>\u003cp class=\"noindent\">「そんな人いますか？」\u003c/p>\u003cp class=\"noindent\">「いる」\u003c/p>\u003cp>先輩は断言した。\u003c/p>\u003cp class=\"noindent\">「自分は悪くない」\u003c/p>\u003cp class=\"noindent\">「周りが悪い」\u003c/p>\u003cp class=\"noindent\">「会社が悪い」\u003c/p>\u003cp class=\"noindent\">「上司が悪い」\u003c/p>\u003cp class=\"noindent\">「運が悪い」\u003c/p>\u003cp>一本ずつ指を折りながら数えていく。\u003c/p>\u003cp class=\"noindent\">「そうやって全部外に原因を求める奴な」\u003c/p>\u003cp>私は何も言えなかった。\u003c/p>\u003cp>確かにそういう人はいた。\u003c/p>\u003cp>注意されても直さない。\u003c/p>\u003cp>失敗しても反省しない。\u003c/p>\u003cp>でも本人は不思議と自信満々だった。\u003c/p>\u003cp>先輩は続ける。\u003c/p>\u003cp class=\"noindent\">「そういう人間は伸びない」\u003c/p>\u003cp class=\"noindent\">「なぜですか」\u003c/p>\u003cp class=\"noindent\">「自分を見ないからだ」\u003c/p>\u003cp>その一言は重かった。\u003c/p>\u003cp>先輩は少し前に身を乗り出す。\u003c/p>\u003cp class=\"noindent\">「劣等感ってのはな」\u003c/p>\u003cp class=\"noindent\">「はい」\u003c/p>\u003cp class=\"noindent\">「心が痛いから嫌われる」\u003c/p>\u003cp class=\"noindent\">「でも成長の入り口でもある」\u003c/p>\u003cp>私は黙って聞く。\u003c/p>\u003cp class=\"noindent\">「俺がお前を見てて思うのはな」\u003c/p>\u003cp>先輩は笑った。\u003c/p>\u003cp class=\"noindent\">「お前、自分のこと過小評価しすぎ」\u003c/p>\u003cp>私は苦笑した。\u003c/p>\u003cp class=\"noindent\">「そんなことないと思いますけど」\u003c/p>\u003cp class=\"noindent\">「ある」\u003c/p>\u003cp>即答だった。\u003c/p>\u003cp class=\"noindent\">「お前さ」\u003c/p>\u003cp class=\"noindent\">「はい」\u003c/p>\u003cp class=\"noindent\">「自分の欠点なら十個言えるだろ」\u003c/p>\u003cp>私は考える。\u003c/p>\u003cp>仕事が遅い。\u003c/p>\u003cp>要領が悪い。\u003c/p>\u003cp>緊張しやすい。\u003c/p>\u003cp>自信がない。\u003c/p>\u003cp>すぐ落ち込む。\u003c/p>\u003cp>たぶん十個以上出てくる。\u003c/p>\u003cp class=\"noindent\">「じゃあ長所は？」\u003c/p>\u003cp>私は口を閉じた。\u003c/p>\u003cp>何も出てこなかった。\u003c/p>\u003cp>先輩は笑う。\u003c/p>\u003cp class=\"noindent\">「ほらな」\u003c/p>\u003cp>図星だった。\u003c/p>\u003cp class=\"noindent\">「それは自己分析じゃない」\u003c/p>\u003cp class=\"noindent\">「じゃあ何なんですか」\u003c/p>\u003cp class=\"noindent\">「自己否定だ」\u003c/p>\u003cp>その言葉に胸がドキッとした。\u003c/p>\u003cp>先輩は続ける。\u003c/p>\u003cp class=\"noindent\">「自己分析ってのはな」\u003c/p>\u003cp class=\"noindent\">「自分の弱みも見る」\u003c/p>\u003cp class=\"noindent\">「でも強みも見る」\u003c/p>\u003cp class=\"noindent\">「得意も見る」\u003c/p>\u003cp class=\"noindent\">「不得意も見る」\u003c/p>\u003cp class=\"noindent\">「全部見るんだよ」\u003c/p>\u003cp>私は黙る。\u003c/p>\u003cp>確かに私は欠点しか見ていなかった。\u003c/p>\u003cp>分析ではない。\u003c/p>\u003cp>裁判だった。\u003c/p>\u003cp>しかも被告も裁判官も自分。\u003c/p>\u003cp>有罪判決しか出ない裁判。\u003c/p>\u003cp>そんなことを毎日繰り返していた。\u003c/p>"},{"id":"c8","num":"第 八 話","title":"","html":"\u003cp>先輩は水を飲みながら言った。\u003c/p>\u003cp class=\"noindent\">「だから劣等感を持つなとは言わない」\u003c/p>\u003cp class=\"noindent\">「はい」\u003c/p>\u003cp class=\"noindent\">「むしろ持ってていい」\u003c/p>\u003cp>私は驚いた。\u003c/p>\u003cp>先輩は続ける。\u003c/p>\u003cp class=\"noindent\">「ただし」\u003c/p>\u003cp>少しだけ真面目な顔になる。\u003c/p>\u003cp class=\"noindent\">「劣等感をコンパスにしろ」\u003c/p>\u003cp class=\"noindent\">「コンパス？」\u003c/p>\u003cp class=\"noindent\">「ああ」\u003c/p>\u003cp class=\"noindent\">「足かせじゃなくてな」\u003c/p>\u003cp>私はその言葉の意味を考える。\u003c/p>\u003cp>先輩は説明した。\u003c/p>\u003cp class=\"noindent\">「仕事が遅い」\u003c/p>\u003cp class=\"noindent\">「なら改善方法を考える」\u003c/p>\u003cp class=\"noindent\">「知識が足りない」\u003c/p>\u003cp class=\"noindent\">「なら勉強する」\u003c/p>\u003cp class=\"noindent\">「経験がない」\u003c/p>\u003cp class=\"noindent\">「なら積む」\u003c/p>\u003cp>そして指を一本立てる。\u003c/p>\u003cp class=\"noindent\">「でも」\u003c/p>\u003cp class=\"noindent\">「自分はダメだ」\u003c/p>\u003cp class=\"noindent\">「自分には価値がない」\u003c/p>\u003cp class=\"noindent\">「自分は向いてない」\u003c/p>\u003cp>そこに進むな\u003c/p>\u003cp>店内の喧騒の中で、その言葉だけが妙にはっきり聞こえた。\u003c/p>\u003cp>先輩は笑う。\u003c/p>\u003cp class=\"noindent\">「劣等感は地図だ」\u003c/p>\u003cp class=\"noindent\">「目的地を教えてくれる」\u003c/p>\u003cp class=\"noindent\">「でも運転するのはお前だ」\u003c/p>\u003cp>私は少し俯いた。\u003c/p>\u003cp>今まで私は劣等感に飲まれていた。\u003c/p>\u003cp>自分を責める材料だと思っていた。\u003c/p>\u003cp>けれど先輩は違うと言う。\u003c/p>\u003cp>足りないところを知れているからこそ成長できる。\u003c/p>\u003cp>そういう意味だった。\u003c/p>\u003cp>先輩は立ち上がりながら言った。\u003c/p>\u003cp class=\"noindent\">「覚えとけ」\u003c/p>\u003cp>私は顔を上げる。\u003c/p>\u003cp class=\"noindent\">「本当に何も考えてない奴は劣等感なんか感じない」\u003c/p>\u003cp>その言葉にハッとした。\u003c/p>\u003cp>確かに。\u003c/p>\u003cp>自分を良くしたいと思うから苦しい。\u003c/p>\u003cp>成長したいと思うから悔しい。\u003c/p>\u003cp>ちゃんとやりたいと思うから落ち込む。\u003c/p>\u003cp>もし本当にどうでもよかったなら。\u003c/p>\u003cp>私はこんなに悩んでいなかったはずだった。\u003c/p>\u003cp>先輩は伝票を手に取る。\u003c/p>\u003cp>そして最後に笑った。\u003c/p>\u003cp class=\"noindent\">「だから安心しろ」\u003c/p>\u003cp class=\"noindent\">「はい」\u003c/p>\u003cp class=\"noindent\">「その劣等感、お前の敵じゃない」\u003c/p>\u003cp>店を出ると眩しい昼の日差しが降り注いでいた。\u003c/p>\u003cp>同期の成功が羨ましい。\u003c/p>\u003cp>自分の未熟さが苦しい。\u003c/p>\u003cp>その気持ちはきっと明日も消えない。\u003c/p>\u003cp>でも。\u003c/p>\u003cp>少しだけ分かった気がした。\u003c/p>\u003cp>劣等感を持っていること自体が悪いわけじゃない。\u003c/p>\u003cp>問題なのは、それを理由に立ち止まることだ。\u003c/p>\u003cp>足りないところが見えているなら。\u003c/p>\u003cp>あとは少しずつ埋めていけばいい。\u003c/p>\u003cp>ランチを終えて見上げた空はいつもよりも明るく見えた。\u003c/p>"}]}</script>
