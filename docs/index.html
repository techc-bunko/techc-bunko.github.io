<style>
.a-rettoukan{--accent-raw:#3f7f8c;--accent:#3f7f8c}
[data-theme="dark"] .a-rettoukan{--accent-raw:#82acb4;--accent:#82acb4}
.a-kokoro{--accent-raw:#6a5a8c;--accent:#6a5a8c}

<script>(function(){try{var p=JSON.parse(localStorage.getItem('yomi.prefs')||'{}');var t=p.theme||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';var d=document.documentElement;d.setAttribute('data-theme',t);d.setAttribute('data-size',String(p.size==null?2:p.size));d.setAttribute('data-font',p.font||'mincho');d.setAttribute('data-writing',p.writing||'horizontal');}catch(e){}})()</script>

<body class="top-page">
<header class="topbar">
  <div class="topbar__in">
    <span class="topbar__home">作品一覧</span>
    <div class="topbar__title"></div>
    <div class="topbar__tools">
      <button class="iconbtn" id="panel-btn" type="button" aria-expanded="false" aria-label="表示設定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h11M4 12h16M4 17h8"/><circle cx="18" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></svg></button>
    </div>
  </div>
</header>
<main>
  <section class="hero wrap">
    <h1 class="hero__title">作品一覧</h1>
    <div class="hero__bars"><i style="background:#3f7f8c"></i><i style="background:#6a5a8c"></i><i style="background:#b07030"></i></div>
  </section>
  <section class="wrap">
    <div class="shelf">
      <a class="card a-rettoukan" href="./rettoukan/">
        <div class="card__meta">
          <span class="card__color">浅葱色</span>
          <span>お仕事・成長小説</span>
        </div>
        <h2 class="card__title">劣等感は味方</h2>
        
        <div class="card__foot">
          <span>全 8 話</span>
          <span class="card__go">読む →</span>
        </div>
      </a>
      <a class="card a-kokoro" href="./kokoro/">
        <div class="card__meta">
          <span class="card__color">菫色</span>
          <span>ヒューマンドラマ</span>
        </div>
        <h2 class="card__title">心の罪</h2>
        <p class="card__tagline">自分でも認めたくない感情を抱いてしまった人が、それでも生きていくための物語</p>
        <div class="card__foot">
          <span>全 7 章</span>
          <span class="card__go">読む →</span>
        </div>
      </a>
      <a class="card a-watashi" href="./watashi/">
        <div class="card__meta">
          <span class="card__color">琥珀色</span>
          <span>家族・自立の物語</span>
        </div>
        <h2 class="card__title">私が、私になる日</h2>
        <p class="card__tagline">私は三回、自分を殺した。</p>
        <div class="card__foot">
          <span>全 8 章</span>
          <span class="card__go">読む →</span>
        </div>
      </a>
    </div>
  </section>
</main>
<footer class="foot">
  <div class="wrap">
    <p>掲載作品はすべてtech.Cによるオリジナルです。<br>
    無断転載・二次配布はご遠慮ください。</p>
  </div>
</footer>
<div class="panel" id="panel" hidden>
  <div class="panel__row">
      <div class="panel__label">明るさ</div>
      <div class="seg"><button type="button" data-pref="theme" data-value="auto" aria-pressed="false">端末に合わせる</button><button type="button" data-pref="theme" data-value="light" aria-pressed="false">明</button><button type="button" data-pref="theme" data-value="dark" aria-pressed="false">暗</button></div>
    </div>
  <div class="panel__row">
      <div class="panel__label">文字の大きさ</div>
      <div class="seg"><button type="button" data-pref="size" data-value="0" aria-pressed="false">小</button><button type="button" data-pref="size" data-value="1" aria-pressed="false">中小</button><button type="button" data-pref="size" data-value="2" aria-pressed="false">標準</button><button type="button" data-pref="size" data-value="3" aria-pressed="false">中大</button><button type="button" data-pref="size" data-value="4" aria-pressed="false">大</button></div>
    </div>
  <div class="panel__row">
      <div class="panel__label">書体</div>
      <div class="seg"><button type="button" data-pref="font" data-value="mincho" aria-pressed="false">明朝</button><button type="button" data-pref="font" data-value="gothic" aria-pressed="false">ゴシック</button></div>
    </div>
  <div class="panel__row">
      <div class="panel__label">組み方</div>
      <div class="seg"><button type="button" data-pref="writing" data-value="horizontal" aria-pressed="false">横組み</button><button type="button" data-pref="writing" data-value="vertical" aria-pressed="false">縦組み</button></div>
    </div>
  <p class="panel__note">設定はこの端末に保存され、どの作品にも適用されます。</p>
</div>
